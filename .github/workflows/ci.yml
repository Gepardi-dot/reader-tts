name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend: Python syntax check
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check server/app.py
        run: python -m py_compile server/app.py
      - name: Check pdf_to_audio.py
        run: python -m py_compile pdf_to_audio.py

  # ─────────────────────────────────────────────────────────────────────────
  # Primary frontend (web-next): lint → build
  # This is the app deployed to Cloudflare Pages.
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — web-next (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: web-next

      - name: Lint
        run: npm run lint
        working-directory: web-next

      # Guardrail: SW must never cache HTML/assets/API (broke returning logins).
      - name: Assert service-worker policy
        run: npm run assert:sw-policy
        working-directory: web-next

      - name: Type-check + build
        run: npm run build
        working-directory: web-next

      - name: Assert SW policy in dist
        run: node scripts/assert-sw-policy.mjs --dist
        working-directory: web-next
