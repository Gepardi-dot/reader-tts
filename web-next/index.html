    <meta name="theme-color" content="#F7F7F5" />
    <meta name="application-name" content="HiggsRead" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>HiggsRead</title>
    <!--
      Inline, runs before the app module. Deletes legacy service-worker shell
      caches that used to pin index.html and break login. Safe no-op on clean browsers.
    -->
    <script>
      (function () {
        try {
          if (!('caches' in window)) return
          // Permanent: never keep app-shell caches (they broke returning logins).
          // Only Kokoro models + cover thumbs may stay in Cache Storage.
          caches.keys().then(function (keys) {
            return Promise.all(
              keys.map(function (k) {
                if (k.indexOf('kokoro-model-') === 0 || k.indexOf('book-covers-') === 0) {
                  return null
                }
                return caches.delete(k)
              }),
            )
          }).catch(function () {})
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
