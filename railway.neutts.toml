# Railway deployment for the NeuTTS remote server.
# This is a SEPARATE service from the main Vercel app.
#
# Deploy:
#   railway login
#   railway link          # link to your Railway project
#   railway up --service neutts --dockerfile Dockerfile.neutts
#
# Required Railway environment variables (set in Railway dashboard):
#   NEUTTS_API_KEY          A strong random secret (openssl rand -hex 32)
#
# Optional:
#   NEUTTS_MODEL            neuphonic/neutts-nano-q4-gguf  (default, faster)
#                           neuphonic/neutts-air-q4-gguf   (higher quality)
#   HF_HOME                 /app/.hf_cache  (already set in Dockerfile)
#
# After deploy, get your service URL from Railway dashboard, then set in Vercel:
#   NEUTTS_REMOTE_URL       https://neutts-production-xxxx.up.railway.app
#   NEUTTS_REMOTE_API_KEY   <same value as NEUTTS_API_KEY above>
#
# Sync voice packs after deploy:
#   NEUTTS_REMOTE_URL=https://... NEUTTS_REMOTE_API_KEY=... python scripts/neutts_sync_voices.py

[build]
dockerfile = "Dockerfile.neutts"

[deploy]
startCommand = "python /app/server.py"
healthcheckPath = "/v1/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[volumes]]
mountPath = "/app/voices"
name = "neutts-voices"

[[volumes]]
mountPath = "/app/cache"
name = "neutts-cache"

[[volumes]]
mountPath = "/app/.hf_cache"
name = "neutts-hf-cache"
