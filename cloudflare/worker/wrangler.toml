name = "reader-tts-api"
main = "src/index.ts"
compatibility_date = "2026-06-29"

[vars]
APP_NAME = "reader-tts"
GEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts"
# Comma-separated browser origins allowed to call this API (CORS).
# Production SPA is on Vercel; local Vite ports are included as defaults in code too.
APP_ORIGIN = "https://readertts.vercel.app,http://localhost:5175,http://localhost:5173,http://127.0.0.1:5175"

[[d1_databases]]
binding = "DB"
database_name = "reader_tts"
database_id = "c58a5509-40d7-439a-8bfb-42b8d990a245"

[[r2_buckets]]
binding = "AUDIO_CACHE"
bucket_name = "reader-tts-audio-cache"
